<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Tip & Bagi Tagihan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Kalkulator Tip & Bagi Tagihan</h1>
            <p>Hitung total tip dan pembagian tagihan per orang secara otomatis.</p>
        </header>

        <div class="splitter-card">
            <!-- Form Input -->
            <div class="form-section">
                <!-- Input Total Tagihan -->
                <div class="input-group">
                    <label for="billInput">Total Tagihan (Rp)</label>
                    <input type="number" id="billInput" placeholder="Contoh: 150000" min="0" value="100000">
                </div>

                <!-- Persentase Tip -->
                <div class="input-group">
                    <label>Pilih Tip (%): <span id="tipVal">10%</span></label>
                    <div class="tip-buttons">
                        <button class="btn-tip" data-tip="5">5%</button>
                        <button class="btn-tip active" data-tip="10">10%</button>
                        <button class="btn-tip" data-tip="15">15%</button>
                        <button class="btn-tip" data-tip="20">20%</button>
                    </div>
                    <input type="range" id="tipSlider" min="0" max="50" value="10">
                </div>

                <!-- Jumlah Orang -->
                <div class="input-group">
                    <label for="peopleInput">Jumlah Orang</label>
                    <div class="people-control">
                        <button id="btnDecrement" class="btn-counter">-</button>
                        <input type="number" id="peopleInput" min="1" value="2" readonly>
                        <button id="btnIncrement" class="btn-counter">+</button>
                    </div>
                </div>
            </div>

            <!-- Hasil Perhitungan -->
            <div class="result-section">
                <h2>Rincian Pembayaran</h2>

                <div class="result-row">
                    <div class="result-label">
                        <span>Tip / Orang</span>
                        <small>Per orang</small>
                    </div>
                    <span class="result-value" id="tipPerPerson">Rp 5.000</span>
                </div>

                <div class="result-row">
                    <div class="result-label">
                        <span>Total / Orang</span>
                        <small>Tagihan + Tip</small>
                    </div>
                    <span class="result-value highlight" id="totalPerPerson">Rp 55.000</span>
                </div>

                <div class="result-divider"></div>

                <div class="result-summary">
                    <p>Total Tip: <strong id="totalTip">Rp 10.000</strong></p>
                    <p>Grand Total: <strong id="grandTotal">Rp 110.000</strong></p>
                </div>

                <button id="btnReset" class="btn-reset">Reset Kalkulator</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
